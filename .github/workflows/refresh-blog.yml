name: Refresh blog numbers

on:
  schedule:
    - cron: "40 11 * * *"   # daily, about 7:40am Eastern, after the database update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update fund numbers in blog posts
        run: node scripts/refresh-blog.js
      - name: Save changes
        run: |
          git config user.name "blog-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh blog numbers [skip ci]"
            git push
          fi
